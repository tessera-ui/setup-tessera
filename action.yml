name: Set up Tessera
description: Set up Rust, Tessera, and the selected Tessera platform toolchains.
author: Tessera UI
branding:
  icon: package
  color: orange
inputs:
  toolchain:
    description: Rust toolchain passed to setup-rust-toolchain.
    default: stable
  components:
    description: Rust components passed to setup-rust-toolchain.
    default: rustfmt,rust-src,rust-analyzer
  target:
    description: Rust targets passed to setup-rust-toolchain.
    default: wasm32-unknown-unknown
  targets:
    description: Deprecated alias for target; when set, it takes precedence.
    default: ""
  rustflags:
    description: Rust flags passed to setup-rust-toolchain.
    default: "-D warnings"
  matcher:
    description: Enable the Rust problem matcher.
    default: "true"
  override:
    description: Set the selected Rust toolchain as the directory override.
    default: "true"
  rust-src-dir:
    description: Path to the Rust source directory passed to setup-rust-toolchain.
    default: ""
  platforms:
    description: "Comma-separated Tessera platforms to prepare: host, web, android, ios."
    default: host,web
  tessera-version:
    description: "Tessera CLI source: auto, workspace, crates-io:VERSION, or git:REVISION."
    default: auto
  tessera-repository:
    description: Git repository used by the git Tessera CLI source.
    default: https://github.com/tessera-ui/tessera.git
  tools:
    description: Comma-separated development tools installed through taiki-e/install-action.
    default: cargo-nextest,rust-script,cargo-packager
  tool-profile:
    description: Cargo profile used to build the workspace Tessera CLI.
    default: dev
  target-directory:
    description: Cargo target directory to cache, relative to the workspace.
    default: target
  android-java-version:
    description: Java version used for Android builds.
    default: "21"
  android-ndk-version:
    description: Android NDK version used for Android builds.
    default: r28c
  android-architectures:
    description: "Android architectures to prepare: arm64 and/or x86_64."
    default: arm64,x86_64
  binaryen-version:
    description: Binaryen version, or latest.
    default: latest
  cache:
    description: Enable Tessera's own Cargo and tool caches.
    default: "true"
  cache-key:
    description: Additional cache namespace for incompatible build configurations.
    default: v1
runs:
  using: composite
  steps:
    - name: Set up Rust
      id: rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        target: ${{ inputs.targets || inputs.target }}
        rustflags: ${{ inputs.rustflags }}
        matcher: ${{ inputs.matcher }}
        override: ${{ inputs.override }}
        rust-src-dir: ${{ inputs.rust-src-dir }}
        cache: false

    - name: Resolve Tessera CLI source
      id: resolve
      shell: bash
      env:
        TESSERA_VERSION: ${{ inputs.tessera-version }}
        TESSERA_REPOSITORY: ${{ inputs.tessera-repository }}
        PLATFORM_LIST: ${{ inputs.platforms }}
        TOOL_LIST: ${{ inputs.tools }}
        TARGET_LIST: ${{ inputs.targets || inputs.target }}
        CACHE_NAMESPACE: ${{ inputs.cache-key }}
        TOOL_PROFILE: ${{ inputs.tool-profile }}
        BINARYEN_VERSION: ${{ inputs.binaryen-version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        key_safe() {
          printf '%s' "$1" | sed 's/[^A-Za-z0-9._-]/-/g'
        }

        binaryen_version="$BINARYEN_VERSION"
        if [[ "$binaryen_version" == latest && ",$PLATFORM_LIST," == *,web,* ]]; then
          binaryen_version=$(gh release view --repo WebAssembly/binaryen --json tagName --jq .tagName)
        fi

        version="$TESSERA_VERSION"
        if [[ "$version" == auto ]]; then
          if [[ -f crates/cargo-tessera/Cargo.toml ]]; then
            version=workspace
          else
            version=crates-io
          fi
        fi

        case "$version" in
          workspace)
            key="workspace-$(git rev-parse HEAD 2>/dev/null || echo unknown)"
            ;;
          crates-io)
            number=$(curl --fail --silent --show-error https://index.crates.io/ca/rg/cargo-tessera | jq -s -r 'map(select(.yanked == false)) | last | .vers')
            version="crates-io:$number"
            key="$version"
            ;;
          crates-io:*)
            key="$version"
            ;;
          git:*)
            key="$version"
            ;;
          *)
            echo "Unsupported tessera-version: $version" >&2
            exit 2
            ;;
        esac

        key=$(key_safe "$key")
        platforms_key=$(key_safe "$PLATFORM_LIST")
        tools_key=$(key_safe "${TOOL_LIST:-none}")
        target_key=$(key_safe "$TARGET_LIST")
        cache_key=$(key_safe "$CACHE_NAMESPACE")
        profile_key=$(key_safe "$TOOL_PROFILE")
        binaryen_key=$(key_safe "$binaryen_version")
        build_environment=$(env | LC_ALL=C sort | grep -E '^(RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|CARGO_INCREMENTAL|CARGO_PROFILE_[^=]*|CARGO_BUILD_[^=]*|CC|CXX|CFLAGS|CXXFLAGS|LDFLAGS)=' | sha256sum | cut -d' ' -f1)

        {
          echo "version=$version"
          echo "key=$key"
          echo "platforms_key=$platforms_key"
          echo "tools_key=$tools_key"
          echo "target_key=$target_key"
          echo "cache_key=$cache_key"
          echo "profile_key=$profile_key"
          echo "binaryen_key=$binaryen_key"
          echo "binaryen_version=$binaryen_version"
          echo "build_environment=$build_environment"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Cargo and build cache
      id: cargo-cache
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.target-directory }}
        key: tessera-cargo-v2-${{ steps.resolve.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ steps.resolve.outputs.build_environment }}-${{ steps.resolve.outputs.platforms_key }}-${{ steps.resolve.outputs.target_key }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ steps.resolve.outputs.key }}
        restore-keys: |
          tessera-cargo-v2-${{ steps.resolve.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ steps.resolve.outputs.build_environment }}-${{ steps.resolve.outputs.platforms_key }}-${{ steps.resolve.outputs.target_key }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}-
          tessera-cargo-v2-${{ steps.resolve.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ steps.resolve.outputs.build_environment }}-${{ steps.resolve.outputs.platforms_key }}-${{ steps.resolve.outputs.target_key }}-

    - name: Restore unchanged source timestamps
      if: inputs.cache == 'true'
      shell: bash
      env:
        TARGET_DIRECTORY: ${{ inputs.target-directory }}
      run: |
        if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          node "$GITHUB_ACTION_PATH/scripts/source-mtimes.cjs" "$TARGET_DIRECTORY"
        fi

    - name: Restore Tessera tools
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/setup-tessera
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: tessera-tools-v2-${{ steps.resolve.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ steps.resolve.outputs.build_environment }}-${{ steps.resolve.outputs.key }}-${{ steps.resolve.outputs.profile_key }}-${{ steps.resolve.outputs.tools_key }}-${{ steps.resolve.outputs.binaryen_key }}-${{ hashFiles('crates/cargo-tessera/**') }}
        restore-keys: |
          tessera-tools-v2-${{ steps.resolve.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ steps.resolve.outputs.build_environment }}-${{ steps.resolve.outputs.key }}-${{ steps.resolve.outputs.profile_key }}-

    - name: Install Tessera CLI
      shell: bash
      env:
        TESSERA_VERSION: ${{ steps.resolve.outputs.version }}
        TESSERA_REPOSITORY: ${{ inputs.tessera-repository }}
        TESSERA_PROFILE: ${{ inputs.tool-profile }}
        TARGET_DIRECTORY: ${{ inputs.target-directory }}
      run: |
        set -euo pipefail

        tool_root="${CARGO_HOME:-$HOME/.cargo}"
        tool_bin="$tool_root/bin/cargo-tessera"
        if [[ "${RUNNER_OS:-}" == Windows ]]; then
          tool_bin+=".exe"
        fi
        mkdir -p "$(dirname "$tool_bin")"
        echo "CARGO_TARGET_DIR=$TARGET_DIRECTORY" >> "$GITHUB_ENV"

        if [[ "$TESSERA_VERSION" == workspace ]]; then
          export CARGO_TARGET_DIR="$TARGET_DIRECTORY"
          executable=$(cargo build --package cargo-tessera --locked --profile "$TESSERA_PROFILE" --message-format=json-render-diagnostics |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "cargo-tessera" and .executable != null) | .executable')
          cp "$executable" "$tool_bin"
        elif [[ -x "$tool_bin" ]]; then
          echo "Using cached cargo-tessera ($TESSERA_VERSION)."
        elif [[ "$TESSERA_VERSION" == crates-io:* ]]; then
          cargo install cargo-tessera --version "${TESSERA_VERSION#crates-io:}" --locked --debug --root "$tool_root"
        elif [[ "$TESSERA_VERSION" == git:* ]]; then
          cargo install --git "$TESSERA_REPOSITORY" --rev "${TESSERA_VERSION#git:}" --package cargo-tessera --locked --debug --root "$tool_root"
        else
          echo "Unsupported tessera-version: $TESSERA_VERSION" >&2
          exit 2
        fi

        echo "$tool_root/bin" >> "$GITHUB_PATH"

    - name: Install Tessera development tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}
        fallback: cargo-binstall

    - name: Set up Android
      if: contains(inputs.platforms, 'android')
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.android-java-version }}

    - name: Set up Android NDK
      if: contains(inputs.platforms, 'android')
      id: android-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ inputs.android-ndk-version }}

    - name: Configure Android targets
      if: contains(inputs.platforms, 'android')
      shell: bash
      env:
        ANDROID_ARCHITECTURES: ${{ inputs.android-architectures }}
        ANDROID_NDK_HOME: ${{ steps.android-ndk.outputs.ndk-path }}
        NDK_HOME: ${{ steps.android-ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
        echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
        targets=()
        IFS=',' read -ra architectures <<< "$ANDROID_ARCHITECTURES"
        for architecture in "${architectures[@]}"; do
          case "$architecture" in
            arm64) targets+=(aarch64-linux-android) ;;
            x86_64) targets+=(x86_64-linux-android) ;;
            *) echo "Unsupported Android architecture: $architecture" >&2; exit 2 ;;
          esac
        done
        rustup target add "${targets[@]}"

    - name: Set up iOS
      if: contains(inputs.platforms, 'ios')
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS:-}" != macOS ]]; then
          echo "The iOS Tessera platform requires a macOS runner with Xcode." >&2
          exit 2
        fi
        command -v xcodebuild >/dev/null
        if ! command -v xcodegen >/dev/null; then
          brew install xcodegen
        fi
        rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

    - name: Set up Binaryen
      if: contains(inputs.platforms, 'web')
      shell: bash
      env:
        BINARYEN_VERSION: ${{ steps.resolve.outputs.binaryen_version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS:-}" in
          Linux)
            repo=WebAssembly/binaryen
            tag="$BINARYEN_VERSION"
            if [[ "$tag" == latest ]]; then
              tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
            fi
            archive="binaryen-$tag-x86_64-linux.tar.gz"
            directory="$HOME/.cache/setup-tessera/binaryen/$tag"
            if [[ -x "$directory/bin/wasm-opt" ]]; then
              echo "$directory/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            mkdir -p "$directory"
            cd "$RUNNER_TEMP"
            gh release download "$tag" --repo "$repo" --pattern "$archive" --pattern "$archive.sha256"
            sha256sum -c "$archive.sha256"
            tar -xzf "$archive" -C "$directory" --strip-components=1
            echo "$directory/bin" >> "$GITHUB_PATH"
            ;;
          macOS)
            command -v wasm-opt >/dev/null || brew install binaryen
            ;;
          Windows)
            case "${RUNNER_ARCH:-X64}" in
              X64) binaryen_arch=x86_64 ;;
              ARM64) binaryen_arch=arm64 ;;
              *) echo "Unsupported Windows architecture for Binaryen: ${RUNNER_ARCH:-unknown}" >&2; exit 2 ;;
            esac
            archive="binaryen-$BINARYEN_VERSION-$binaryen_arch-windows.tar.gz"
            directory="$HOME/.cache/setup-tessera/binaryen/$BINARYEN_VERSION"
            if [[ -x "$directory/bin/wasm-opt.exe" ]]; then
              echo "$directory/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            mkdir -p "$directory"
            cd "$RUNNER_TEMP"
            gh release download "$BINARYEN_VERSION" --repo WebAssembly/binaryen --pattern "$archive" --pattern "$archive.sha256"
            sha256sum -c "$archive.sha256"
            tar -xzf "$archive" -C "$directory" --strip-components=1
            echo "$directory/bin" >> "$GITHUB_PATH"
            ;;
          *)
            echo "Unsupported runner for Binaryen: ${RUNNER_OS:-unknown}" >&2
            exit 2
            ;;
        esac
