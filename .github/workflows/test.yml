name: Test setup action

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Cargo source timestamp restoration
        shell: bash
        run: node --test scripts/source-mtimes.test.cjs
      - uses: ./
      - name: Verify installed toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
          cargo tessera --help
          cargo nextest --version
          rust-script --version
          wasm-opt --version
